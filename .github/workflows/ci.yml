name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      # Pulls evergreen's rubocop.yml fresh (remote inherit_from)
      - name: Lint Ruby
        run: bin/rubocop -f github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Sync Prettier config from evergreen
        run: bin/sync-style

      - name: Check frontend formatting
        run: yarn format:check

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Request specs render vite_javascript_tag, which auto-builds in test
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare && bundle exec rspec

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

  resolver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resolver
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: resolver/go.mod
          cache-dependency-path: resolver/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet and test
        run: go vet ./... && go test ./...

  # Publishes the images TARS pulls (`tars deploy pitcrew`), only once every check passes on main.
  publish_app:
    runs-on: ubuntu-latest
    needs: [scan_ruby, lint, test, frontend, resolver]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aaronmiler/pitcrew:latest
            ghcr.io/aaronmiler/pitcrew:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  # One resolver image per runtime version. Adding a Ruby is one matrix entry (plus a
  # sidecar in the tars stack and its PITCREW_RESOLVERS entry).
  publish_resolvers:
    runs-on: ubuntu-latest
    needs: [scan_ruby, lint, test, frontend, resolver]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag: ruby-3.2
            base: ruby:3.2-slim
          - tag: ruby-3.3
            base: ruby:3.3-slim
          - tag: ruby-3.4
            base: ruby:3.4-slim
          - tag: ruby-4.0
            base: ruby:4.0-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the ${{ matrix.tag }} resolver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.resolver
          push: true
          build-args: |
            BASE=${{ matrix.base }}
          tags: |
            ghcr.io/aaronmiler/pitcrew-resolver:${{ matrix.tag }}
            ghcr.io/aaronmiler/pitcrew-resolver:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=resolver-${{ matrix.tag }}
          cache-to: type=gha,scope=resolver-${{ matrix.tag }},mode=max
